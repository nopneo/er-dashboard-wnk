name: แจ้งปัญหา
description: หน้าจอทำงานผิด ตัวเลขผิด หรือติดตั้งไม่ได้ (หลังรัน setup_check.py แล้ว)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **ก่อนแจ้ง** — รัน `python setup_check.py` (Docker: `docker exec <ชื่อ container> python setup_check.py`) แล้วแก้ข้อ ✘ ก่อน
        ปัญหาติดตั้งส่วนใหญ่มาจากสภาพแวดล้อมของเครื่อง (Python, firewall, สิทธิ์ฐานข้อมูล, เขตเวลา)
        ตัวเลขดูผิด → เปิดหน้า `/check` (ตรวจข้อมูลก่อนใช้) จากเครื่องในโรงพยาบาลก่อน — รหัสประเภทการมา การจำหน่าย แผนก ER ฯลฯ ของแต่ละ รพ. ไม่เหมือนกัน

        ⚠ **ห้ามแนบข้อมูลผู้ป่วย** (HN ชื่อ เลขบัตร) ชื่อบุคลากรจากรายงานพยาบาล หรือรหัสผ่าน / ค่าใน `.env` — ปิดบังในภาพหน้าจอก่อนแนบ
  - type: dropdown
    id: kind
    attributes:
      label: ประเภทปัญหา
      options:
        - ติดตั้ง / เปิดแอปไม่ได้
        - หน้าจอทำงานผิด (ปุ่ม กราฟ ตาราง)
        - ตัวเลขไม่ตรงกับรายงาน ER ของโรงพยาบาล
        - รายงานพยาบาลตรวจแทนแพทย์
        - ปุ่มส่งออก JPG / PNG / PDF
        - อื่น ๆ
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: เวอร์ชัน
      description: ดูท้ายหน้าแดชบอร์ด เช่น 1.3.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: ติดตั้งแบบไหน
      options:
        - Linux (systemd / gunicorn)
        - Windows
        - Docker
    validations:
      required: true
  - type: textarea
    id: setup_check
    attributes:
      label: ผลของ setup_check.py
      description: คัดลอกผลทั้งหมดมาวาง (ไม่มีข้อมูลผู้ป่วยหรือรหัสผ่านในผลนี้)
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: เกิดอะไรขึ้น และควรเป็นอย่างไร
      description: ทำอะไร ช่วงวันที่ไหน หน้าไหน เห็นอะไร · ตัวเลขผิด → บล็อกไหน ตัวเลขเท่าไร รายงานเดิมได้เท่าไร
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: ข้อความ error / log (ถ้ามี)
      description: Linux `journalctl -u er-dashboard -n 50` · Docker `docker logs --tail 50 <ชื่อ container>`
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: ยืนยัน
      options:
        - label: ไม่มีข้อมูลผู้ป่วย ชื่อบุคลากร หรือรหัสผ่านในสิ่งที่แนบมา
          required: true
